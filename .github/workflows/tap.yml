# Updates the Homebrew tap for a release that is already published, without building or publishing anything.
# Use it when the tap step of the release workflow failed (a token without write access, a network error):
#   gh workflow run tap.yml -f tag=v0.3.0
# The formula is made from the checksums.txt of the published release, so it fits the files that users get.
name: tap

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag of a published release, like v0.3.0"
        required: true

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "the tag must look like v0.3.0" >&2; exit 1 ;;
          esac
      - name: Get the checksums of the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --pattern checksums.txt --dir published
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set." >&2
            exit 1
          fi
          scripts/formula.sh "$TAG" published/checksums.txt > omamori.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kenzietann/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp omamori.rb tap/Formula/omamori.rb
          cd tap
          git config user.name "omamori release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/omamori.rb
          if git diff --cached --quiet; then
            echo "The tap has this formula already."
            exit 0
          fi
          git commit -m "omamori $TAG"
          git push
