# Builds and publishes a release when a tag like v0.2.0 is pushed, then updates the Homebrew tap. The tag is pushed by hand.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: scripts/release.sh "$GITHUB_REF_NAME"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt \
            --title "Omamori $GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
      - name: Update the Homebrew tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "HOMEBREW_TAP_TOKEN is not set, so the Homebrew tap is not updated."
            exit 0
          fi
          scripts/formula.sh "$GITHUB_REF_NAME" > omamori.rb
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/kenzietann/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp omamori.rb tap/Formula/omamori.rb
          cd tap
          git config user.name "omamori release"
          git config user.email "actions@users.noreply.github.com"
          git add Formula/omamori.rb
          git commit -m "omamori $GITHUB_REF_NAME"
          git push
