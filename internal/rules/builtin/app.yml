title: Refused request at a web application
name: app_request_denied
id: 6f3a2c10-0607-4a6e-9d7b-0a1b2c3d4e07
description: A request that the application refused (401 or 403). It is counted by another rule and gives no alert alone.
level: informational
logsource: {category: webserver}
detection:
  selection:
    status: ['401', '403']
  condition: selection
tests:
  - name: refused requests
    events:
      - {category: "webserver", method: "POST", url: "/api/orders", status: 401, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "GET", url: "/admin", status: 403, src_ip: "203.0.113.77"}
    expect: {alerts: 2}
  - name: other answers
    events:
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 404, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 200, src_ip: "203.0.113.77"}
    expect: {alerts: 0}
---
