title: Many server errors caused by one address
name: app_server_error_burst
id: 6f3a2c10-0610-4a6e-9d7b-0a1b2c3d4e10
description: Requests of one address ended with a server error twenty or more times in five minutes. Inputs that break an application are how injections and other exploits are tried. A broken release does it too, for every address.
level: medium
tags: [attack.initial_access, attack.t1190]
correlation:
  type: event_count
  rules: [app_server_error]
  group-by: [src_ip]
  timespan: 5m
  condition: {gte: 20}
tests:
  - name: twenty server errors of one address are one alert
    events:
      - {category: "webserver", method: "GET", url: "/api/items?id=0'", status: 500, src_ip: "203.0.113.77"}
