title: Many accounts tried at a web application
name: app_credential_stuffing
id: 6f3a2c10-0604-4a6e-9d7b-0a1b2c3d4e04
description: One address had refused logins for ten or more different accounts in ten minutes. This is how lists of leaked passwords are tried. It needs logs that name the account.
level: high
tags: [attack.credential_access, attack.t1110.004]
correlation:
  type: value_count
  rules: [app_login_failure, app_login_failure_message]
  group-by: [src_ip]
  timespan: 10m
  condition: {gte: 10, field: user}
tests:
  - name: ten accounts are one alert
    events:
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user0@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user1@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user2@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user3@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user4@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user5@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user6@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user7@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user8@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "user9@example.test"}
    expect: {alerts: 1}
  - name: one account ten times is guessing, not this
    events:
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "admin@example.test"}
      - {product: "app", message: "Login failed", src_ip: "203.0.113.77", user: "admin@example.test"}
