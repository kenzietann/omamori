title: Login to a web application
name: app_login_success
id: 6f3a2c10-0605-4a6e-9d7b-0a1b2c3d4e05
description: A login request that was answered with success. It is used by another rule and gives no alert alone.
level: informational
logsource: {category: webserver}
detection:
  login:
    method: POST
    url|re|i: '(^|[/_-])(login|log-in|signin|sign-in|sign_in|session|sessions|token|authenticate|auth)(/?$|[/?.])'
  done:
    status: ['200', '201', '204']
  condition: login and done
tests:
  - name: a login that worked
    events:
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 200, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/api/v1/auth/token", status: 201, src_ip: "203.0.113.77"}
    expect: {alerts: 2}
  - name: a refused login
    events:
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 401, src_ip: "203.0.113.77"}
    expect: {alerts: 0}
---
