title: Database error from an input
name: app_sql_error
id: 6f3a2c10-0612-4a6e-9d7b-0a1b2c3d4e12
description: The application wrote that a database query had a syntax error. When an input reaches a query, this is what an SQL injection attempt looks like from inside. A bug in a query does it too.
level: medium
tags: [attack.initial_access, attack.t1190]
logsource: {product: app}
detection:
  selection:
    message|re|i: 'SQLSTATE\[42|syntax error at or near|You have an error in your SQL syntax|ER_PARSE_ERROR|unterminated quoted string|SQLITE_ERROR.{0,40}syntax|ORA-0(0933|0936|1756)|psycopg2?\.errors\.SyntaxError|QueryFailedError.{0,80}syntax|Incorrect syntax near'
  condition: selection
tests:
  - name: errors of several databases and frameworks
    events:
      - {product: "app", message: "SQLSTATE[42000]: Syntax error or access violation: 1064 You have an error in your SQL syntax", src_ip: "203.0.113.77"}
      - {product: "app", message: 'QueryFailedError: syntax error at or near "OR"', src_ip: "203.0.113.77"}
      - {product: "app", message: "psycopg.errors.SyntaxError: unterminated quoted string", src_ip: "203.0.113.77"}
      - {product: "app", message: "Incorrect syntax near 'admin'.", src_ip: "203.0.113.77"}
    expect: {alerts: 4}
  - name: other database messages
    events:
      - {product: "app", message: "Connection to the database restored", src_ip: "203.0.113.77"}
      - {product: "app", message: "SQLSTATE[23000]: Integrity constraint violation", src_ip: "203.0.113.77"}
    expect: {alerts: 0}
