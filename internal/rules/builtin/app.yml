title: Debug or admin endpoint of a framework answered
name: app_debug_endpoint_exposed
id: 6f3a2c10-0611-4a6e-9d7b-0a1b2c3d4e11
description: An endpoint for debugging or monitoring of a framework answered with success. These show settings, secrets, memory or the code of the application, and should not be reachable from outside. Examples - Spring Boot Actuator env and heapdump, the Django and Symfony debug tools, Laravel Telescope, the Rails info page, the H2 console, the Go pprof handlers and the ELMAH page of ASP.NET.
level: high
tags: [attack.discovery, attack.t1190, attack.collection]
logsource: {category: webserver}
detection:
  endpoint:
    url|re|i: '^/(actuator/(env|heapdump|threaddump|configprops|beans|mappings|loggers|jolokia|gateway|httptrace|logfile)|__debug__/|_profiler|_debugbar|telescope|horizon/api|rails/info|h2-console|elmah\.axd|debug/pprof|debug/vars|phpinfo\.php|_ignition/)'
  answered:
    status: ['200']
  condition: endpoint and answered
tests:
  - name: debug endpoints that answered
    events:
      - {category: "webserver", method: "GET", url: "/actuator/env", status: 200, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "GET", url: "/actuator/heapdump", status: 200, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "GET", url: "/debug/pprof/heap", status: 200, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "GET", url: "/telescope/requests", status: 200, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "GET", url: "/rails/info/routes", status: 200, src_ip: "203.0.113.77"}
    expect: {alerts: 5}
  - name: refused or not there, and the health check
    events:
      - {category: "webserver", method: "GET", url: "/actuator/env", status: 404, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "GET", url: "/actuator/env", status: 401, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "GET", url: "/actuator/health", status: 200, src_ip: "203.0.113.77"}
    expect: {alerts: 0}
