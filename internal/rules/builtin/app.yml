# Web applications and APIs: the frameworks that most backends are written with (Express, NestJS, ASP.NET Core,
# Spring Boot, Django, Flask, FastAPI, Laravel, Rails, Go, Rust), as their logs say it and as the access log of
# nginx or Apache in front of them says it. A request is category webserver with method, url, status and
# src_ip, from every source. See docs/apps.md.
title: Failed login at a web application
name: app_login_failure
id: 6f3a2c10-0601-4a6e-9d7b-0a1b2c3d4e01
description: A login request to a web application or API was refused. It is counted by other rules and gives no alert alone.
level: low
logsource: {category: webserver}
detection:
  login:
    method: POST
    url|re|i: '(^|[/_-])(login|log-in|signin|sign-in|sign_in|session|sessions|token|authenticate|auth)(/?$|[/?.])'
  refused:
    status: ['400', '401', '403', '422', '429']
  condition: login and refused
tests:
  - name: refused logins of several frameworks
    events:
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 401, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/users/sign_in", status: 422, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/api/v1/auth/token?grant=password", status: 400, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/wp-login.php", status: 403, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/login", status: 429, src_ip: "203.0.113.77"}
    expect: {alerts: 5}
  - name: a login that worked, a GET of the page, and an API that is not a login
    events:
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 200, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "GET", url: "/api/auth/login", status: 401, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/api/tokenizer", status: 401, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/api/orders", status: 401, src_ip: "203.0.113.77"}
    expect: {alerts: 0}
---
title: Login failure written by the application
name: app_login_failure_message
id: 6f3a2c10-0602-4a6e-9d7b-0a1b2c3d4e02
description: A line that an application wrote says that a login failed. It is counted by other rules and gives no alert alone.
level: low
logsource: {product: app}
detection:
  failed:
    message|re|i: '\b(login|log in|logon|sign[- ]?in|authentication|auth)\b.{0,20}\b(failed|failure|unsuccessful|rejected|denied)\b|\b(failed|unsuccessful|invalid)\s+(login|log ?in|logon|sign[- ]?in|authentication)\b|\binvalid (credentials|password|username or password|login)\b|\bbad credentials\b|\b(wrong|incorrect) (password|credentials)\b'
  condition: failed
tests:
  - name: messages of several frameworks
    events:
      - {product: "app", message: "Failed login for admin from 203.0.113.77", src_ip: "203.0.113.77"}
      - {product: "app", message: "Authentication failed for user admin", src_ip: "203.0.113.77"}
      - {product: "app", message: "Bad credentials", src_ip: "203.0.113.77"}
      - {product: "app", message: "Invalid credentials supplied", src_ip: "203.0.113.77"}
      - {product: "app", message: "login attempt failed: wrong password", src_ip: "203.0.113.77"}
    expect: {alerts: 5}
  - name: ordinary messages
    events:
      - {product: "app", message: "User admin logged in", src_ip: "203.0.113.77"}
      - {product: "app", message: "Mapped {/auth/login, POST} route", src_ip: "203.0.113.77"}
      - {product: "app", message: "Failed to connect to the database", src_ip: "203.0.113.77"}
      - {product: "app", message: "Password reset mail sent", src_ip: "203.0.113.77"}
    expect: {alerts: 0}
---
title: Password guessing at a web application
name: app_login_bruteforce
id: 6f3a2c10-0603-4a6e-9d7b-0a1b2c3d4e03
