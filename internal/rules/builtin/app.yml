title: Server error at a web application
name: app_server_error
id: 6f3a2c10-0609-4a6e-9d7b-0a1b2c3d4e09
description: A request that ended with a server error (5xx). It is counted by another rule and gives no alert alone.
level: informational
logsource: {category: webserver}
detection:
  selection:
    status|re: '^5\d\d$'
  condition: selection
tests:
  - name: server errors
    events:
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 500, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 502, src_ip: "203.0.113.77"}
    expect: {alerts: 2}
  - name: other answers
    events:
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 404, src_ip: "203.0.113.77"}
      - {category: "webserver", method: "POST", url: "/api/auth/login", status: 200, src_ip: "203.0.113.77"}
    expect: {alerts: 0}
