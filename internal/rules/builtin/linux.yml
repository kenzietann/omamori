# Linux host events from syslog: sudo, accounts and cron.
title: Sudo was refused
name: linux_sudo_refused
id: 6f3a2c10-0101-4a6e-9d7b-0a1b2c3d4e01
description: A user who is not allowed to use sudo tried it, or gave wrong passwords.
level: medium
tags: [attack.privilege_escalation, attack.t1548.003]
logsource: {product: linux, service: sudo}
detection:
  selection: {action: sudo, outcome: failure}
  condition: selection
tests:
  - name: a refused sudo matches
    events: [{service: sudo, product: linux, action: sudo, outcome: failure, user: www-data, command: /bin/bash}]
    expect: {alerts: 1}
  - name: a normal sudo does not match
    events: [{service: sudo, product: linux, action: sudo, outcome: success, user: aiko, command: /usr/bin/apt update}]
    expect: {alerts: 0}
---
title: A new user account was made
name: linux_user_created
id: 6f3a2c10-0102-4a6e-9d7b-0a1b2c3d4e02
description: useradd made an account. Attackers make accounts to come back later.
level: medium
tags: [attack.persistence, attack.t1136.001]
logsource: {product: linux}
detection:
  selection: {action: user_created}
  condition: selection
tests:
  - name: a new account matches
    events: [{service: useradd, product: linux, action: user_created, user: support2}]
    expect: {alerts: 1}
  - name: a login does not match
    events: [{service: sshd, product: linux, action: login, outcome: success, user: aiko}]
    expect: {alerts: 0}
