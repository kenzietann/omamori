title: Request with an SQL injection or path traversal pattern
name: web_injection_request
id: 6f3a2c10-0207-4a6e-9d7b-0a1b2c3d4e07
description: One request whose address holds an attack pattern. It is counted by another rule and gives no alert alone.
level: medium
logsource: {category: webserver}
detection:
  sqli:
    url|contains: ['information_schema', "' or '1'='1", '%27+or+', '%27%20or%20', 'sleep(', 'sleep%28', 'benchmark(', 'waitfor+delay', 'waitfor%20delay']
  # "union select" as two whole words. A search for "student union selection" must not match.
  union:
    url|re|i: '(^|[^a-z])union(\+|%20| |/\*\*/)+(all(\+|%20| )+)?select([^a-z]|$)'
  # A quote, then OR or AND as a word, then a quote or a digit, in any mix of raw and encoded characters:
  # Flask writes "1'%20OR%20'1'='1", nginx "1%27%20OR%20%271%27=%271".
  sqli_mixed:
    url|re|i: "(%27|')(\\s|%20|\\+|/\\*\\*/)+(or|and)(\\s|%20|\\+|/\\*\\*/)+(%27|'|\\d)"
  traversal:
    url|contains: ['../..', '..%2f..', '%2e%2e%2f', '%2e%2e/', '..%5c..', '....//']
  condition: sqli or sqli_mixed or union or traversal
tests:
  - name: injection and traversal match
    events:
      - {category: webserver, url: "/item?id=1+UNION+SELECT+user,pass+FROM+users", src_ip: 203.0.113.77}
      - {category: webserver, url: "/download?file=../../../../etc/shadow", src_ip: 203.0.113.77}
      - {category: webserver, url: "/img?f=..%2F..%2F..%2Fetc%2Fhosts", src_ip: 203.0.113.77}
    expect: {alerts: 3}
  - name: a quote and OR in a mix of raw and encoded characters, as Flask writes it
    events:
      - {category: webserver, url: "/api/items?id=1'%20OR%20'1'='1", src_ip: 203.0.113.77}
      - {category: webserver, url: "/api/items?id=1%27+and+1=1", src_ip: 203.0.113.77}
    expect: {alerts: 2}
  - name: a quote in ordinary text is not an injection
    events:
      - {category: webserver, url: "/search?q=children's%20or%20adults%20books", src_ip: 198.51.100.4}
      - {category: webserver, url: "/search?q=rock'n'roll%20or%20jazz", src_ip: 198.51.100.4}
    expect: {alerts: 0}
  - name: ordinary queries do not match
    events:
      - {category: webserver, url: "/search?q=student+union+selection+results", src_ip: 198.51.100.4}
      - {category: webserver, url: "/search?q=reunion+select+committee", src_ip: 198.51.100.4}
      - {category: webserver, url: "/docs/../index.html", src_ip: 198.51.100.4}
      - {category: webserver, url: "/blog/how-to-sleep-better", src_ip: 198.51.100.4}
    expect: {alerts: 0}
---
title: Injection attempts at the web server
name: web_injection_attempt
id: 6f3a2c10-0208-4a6e-9d7b-0a1b2c3d4e08
description: An address sent requests with SQL injection or path traversal patterns. One alert for each burst.
level: high
tags: [attack.initial_access, attack.t1190]
correlation:
  type: event_count
  rules: [web_injection_request]
  group-by: [src_ip]
  timespan: 5m
  condition: {gte: 1}
tests:
  - name: two attempts from one address are one alert
    events:
      - {category: webserver, url: "/item?id=1%27%20OR%20%271%27=%271", src_ip: 203.0.113.77}
      - {category: webserver, url: "/item?id=1;select+sleep(5)", src_ip: 203.0.113.77}
    expect: {alerts: 1}
---
title: Command sent to a web shell
name: web_shell_command
id: 6f3a2c10-0209-4a6e-9d7b-0a1b2c3d4e09
description: A request to a script page carries a shell command in a parameter like c or cmd, and the server answered with success. This is how a web shell is used after it was put on the server.
level: high
tags: [attack.persistence, attack.t1505.003, attack.execution]
logsource: {category: webserver}
detection:
  selection:
    url|re|i: '\.(php\d?|phtml|jsp|aspx?)\?(\S*&)?(c|cmd|exec|command|shell|run)=(id|whoami|uname|pwd|ls|cat|wget|curl|bash|sh|nc|python3?|perl)(\b|%20|\+|$)'
    status|re: '^2'
  condition: selection
tests:
  - name: a command that the server answered
    events:
      - {category: webserver, url: "/uploads/x.php?c=id", status: 200, src_ip: 203.0.113.77}
      - {category: webserver, url: "/wp-content/a.php?x=1&cmd=cat%20/etc/passwd", status: 200, src_ip: 203.0.113.77}
    expect: {alerts: 2}
  - name: a page that is not there, and ordinary parameters
    events:
      - {category: webserver, url: "/uploads/x.php?c=id", status: 404, src_ip: 203.0.113.77}
      - {category: webserver, url: "/index.php?c=idea", status: 200, src_ip: 198.51.100.4}
      - {category: webserver, url: "/shop.php?cat=shoes", status: 200, src_ip: 198.51.100.4}
      - {category: webserver, url: "/run?cmd=id", status: 200, src_ip: 198.51.100.4}
    expect: {alerts: 0}
