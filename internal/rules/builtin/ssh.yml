title: SSH password spraying from one address
name: ssh_password_spray
id: 6f3a2c10-0004-4a6e-9d7b-0a1b2c3d4e04
description: Failed SSH logins for five or more different users from one address in ten minutes.
level: medium
tags: [attack.credential_access, attack.t1110.003]
correlation:
  type: value_count
  rules: [ssh_login_failure]
  group-by: [src_ip]
  timespan: 10m
  condition: {gte: 5, field: user}
tests:
  - name: five users from one address are one alert
    events:
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.50, user: admin}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.50, user: deploy}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.50, user: git}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.50, user: oracle}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.50, user: postgres}
    expect: {alerts: 1}
  - name: many failures for one user are no alert
    events:
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
    expect: {alerts: 0}
