          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
    expect: {alerts: 0}
  - name: three wrong passwords and then a success are no alert
    events:
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
          - {service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}
