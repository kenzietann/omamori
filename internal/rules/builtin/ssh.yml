# SSH logins. Fields come from the syslog parser: action, outcome, user, src_ip, auth_method.
title: SSH login failed
name: ssh_login_failure
id: 6f3a2c10-0001-4a6e-9d7b-0a1b2c3d4e01
description: One failed SSH login. It is counted by other rules and gives no alert alone.
level: low
logsource: {product: linux, service: sshd}
detection:
  selection: {action: login, outcome: failure}
  condition: selection
tests:
  - name: a failure matches
    events: [{service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}]
    expect: {alerts: 1}
  - name: a success and another service do not match
    events:
      - {service: sshd, product: linux, action: login, outcome: success, src_ip: 198.51.100.7, user: aiko}
      - {service: sudo, product: linux, action: login, outcome: failure, user: aiko}
    expect: {alerts: 0}
---
title: SSH login succeeded
name: ssh_login_success
id: 6f3a2c10-0002-4a6e-9d7b-0a1b2c3d4e02
description: One successful SSH login. It is used by other rules and gives no alert alone.
level: informational
logsource: {product: linux, service: sshd}
detection:
  selection: {action: login, outcome: success}
  condition: selection
tests:
  - name: a success matches
    events: [{service: sshd, product: linux, action: login, outcome: success, src_ip: 198.51.100.7, user: aiko}]
    expect: {alerts: 1}
  - name: a failure does not match
    events: [{service: sshd, product: linux, action: login, outcome: failure, src_ip: 203.0.113.9, user: root}]
    expect: {alerts: 0}
---
title: SSH password guessing from one address
