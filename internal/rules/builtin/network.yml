title: SSH login succeeded after guessing from an internal address
name: ssh_internal_guessing_success
id: 6f3a2c10-0403-4a6e-9d7b-0a1b2c3d4e03
description: An internal address guessed passwords of another host and then logged in. Treat both hosts as taken over until they are checked.
level: critical
tags: [attack.lateral_movement, attack.t1021.004, attack.t1078]
correlation:
  type: temporal_ordered
  rules: [ssh_internal_guessing, ssh_login_success]
  group-by: [src_ip]
  timespan: 10m
tests:
  - name: five failures and then a success are one alert
    events:
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: success, src_ip: 10.0.1.10, user: deploy}
    expect: {alerts: 1}
  - name: a success from another internal address is no alert
    events:
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: deploy}
      - {product: linux, service: sshd, action: login, outcome: success, src_ip: 10.0.9.5, user: deploy}
    expect: {alerts: 0}
  - name: two wrong passwords and then a success are no alert
    events:
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: aiko}
      - {product: linux, service: sshd, action: login, outcome: failure, src_ip: 10.0.1.10, user: aiko}
      - {product: linux, service: sshd, action: login, outcome: success, src_ip: 10.0.1.10, user: aiko}
    expect: {alerts: 0}
