title: Network sensor alert of the highest severity
name: ids_severity_one
id: 6f3a2c10-0408-4a6e-9d7b-0a1b2c3d4e08
description: One Suricata alert with severity 1. It is counted by another rule and gives no alert alone.
level: low
logsource: {product: suricata, service: alert}
detection:
  selection: {rule_severity: 1}
  condition: selection
tests:
  - name: severity 1 matches and severity 3 does not
    events:
      - {product: suricata, service: alert, src_ip: 10.0.1.10, dst_ip: 10.0.2.20, rule_severity: 1, signature: "SYNTHETIC scan"}
      - {product: suricata, service: alert, src_ip: 10.0.1.10, dst_ip: 10.0.2.20, rule_severity: 3, signature: "SYNTHETIC info"}
      - {product: suricata, service: flow, src_ip: 10.0.1.10, dst_ip: 10.0.2.20, rule_severity: 1}
    expect: {alerts: 1}
---
title: Network sensor raised its highest severity for an address
name: ids_high_severity_alerts
id: 6f3a2c10-0409-4a6e-9d7b-0a1b2c3d4e09
description: Suricata gave one or more alerts of severity 1 for traffic from one address. One alert for each burst. What it means depends on the signature, which is in the evidence.
level: high
tags: [attack.discovery]
correlation:
  type: event_count
  rules: [ids_severity_one]
  group-by: [src_ip]
  timespan: 10m
  condition: {gte: 1}
tests:
  - name: three sensor alerts for one address are one alert
    events:
      - {product: suricata, service: alert, src_ip: 10.0.1.10, rule_severity: 1}
      - {product: suricata, service: alert, src_ip: 10.0.1.10, rule_severity: 1}
      - {product: suricata, service: alert, src_ip: 10.0.1.10, rule_severity: 1}
    expect: {alerts: 1}
