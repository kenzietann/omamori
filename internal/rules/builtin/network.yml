    expect: {alerts: 1}
  - name: ten tries of one address that is gone are no alert
    events:
      - {product: zeek, service: conn, action: network_connect, src_ip: 10.0.2.20, dst_ip: 10.0.2.99, dst_port: 22, conn_state: S0, bytes_sent: 0}
      - {product: zeek, service: conn, action: network_connect, src_ip: 10.0.2.20, dst_ip: 10.0.2.99, dst_port: 22, conn_state: S0, bytes_sent: 0}
